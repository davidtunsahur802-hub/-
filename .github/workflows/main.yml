name: Build SO2 SkinChanger

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CPP_FILE: Qwen_cpp_20261005_0ad6gz1lu.cpp
  OUTPUT_EXE: SkinChanger.exe

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkgDir = "C:\vcpkg_custom"
          if (Test-Path $vcpkgDir) { Remove-Item -Recurse -Force $vcpkgDir }
          git clone https://github.com/microsoft/vcpkg.git $vcpkgDir
          & "$vcpkgDir\bootstrap-vcpkg.bat"
          & "$vcpkgDir\vcpkg.exe" install imgui[directx11-binding,directx11-rendering] nlohmann-json --triplet x64-windows-static
          echo "VCPKG_CUSTOM=$vcpkgDir" >> $env:GITHUB_ENV

      - name: Compile with cl.exe
        shell: cmd
        run: |
          cl.exe /EHsc /O2 /MT /std:c++20 ^
            /DWIN32 /D_WINDOWS /DNDEBUG ^
            /I"C:\vcpkg_custom\installed\x64-windows-static\include" ^
            %CPP_FILE% ^
            /link ^
            /LIBPATH:"C:\vcpkg_custom\installed\x64-windows-static\lib" ^
            d3d11.lib dxgi.lib d3dcompiler.lib dwmapi.lib ^
            /OUT:%OUTPUT_EXE%

      - name: Verify
